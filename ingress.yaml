apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: releaseapp-ingress
spec:
  rules:
    - host: releaseapp.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: releaseapp-service
                port:
                  number: 80
