apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: release-app
  namespace: argocd
spec:
  source:
    repoURL: https://github.com/iheblahzami/release-gitops
    path: .
    targetRevision: main
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated: {}
